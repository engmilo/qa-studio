<!DOCTYPE html>
<html><head><title>Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Inter,sans-serif; background:#f0f2f5; padding:40px; color:#111827; }
.card { background:#fff; border-radius:20px; border:1px solid #e5e7eb; padding:24px; max-width:480px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
.card h3 { font-size:12px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px; }
.goal { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
.goal .num { font-size:28px; font-weight:800; letter-spacing:-.03em; }
.goal .num span { font-size:14px; font-weight:400; color:#9ca3af; }
.goal .lbl { font-size:12px; color:#9ca3af; font-weight:500; }
.track { height:32px; background:#f3f4f6; border-radius:16px; overflow:hidden; display:flex; position:relative; margin-bottom:10px; }
.track .seg { height:100%; transition:width .4s ease; position:relative; }
.track .seg:first-child { border-radius:16px 0 0 16px; }
.track .seg:last-child { border-radius:0 16px 16px 0; }
.track .seg.only { border-radius:16px; }
.days { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.day { display:flex; align-items:center; gap:8px; font-size:12px; }
.day .dlbl { width:28px; font-weight:600; color:#6b7280; }
.day .dbar { height:6px; border-radius:4px; flex:1; max-width:200px; }
.day .dcnt { font-weight:600; color:#111827; min-width:20px; text-align:right; }
</style>
</head><body>
<div class="card">
  <h3>Weekly Progress</h3>
  <div class="goal">
    <div class="num">87 <span>/ 100</span></div>
    <div class="lbl">this week</div>
  </div>
  <div class="track">
    <div class="seg" style="width:8%;background:#93c5fd"></div>
    <div class="seg" style="width:14%;background:#60a5fa"></div>
    <div class="seg" style="width:4%;background:#3b82f6"></div>
    <div class="seg" style="width:18%;background:#2563eb"></div>
    <div class="seg" style="width:11%;background:#1d4ed8"></div>
    <div class="seg" style="width:22%;background:#6366f1"></div>
    <div class="seg" style="width:15%;background:#8b5cf6"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#9ca3af;">
    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
  </div>
  <div class="days">
    <div class="day"><span class="dlbl">Mon</span><div class="dbar" style="background:#93c5fd;width:28px"></div><span class="dcnt">8</span></div>
    <div class="day"><span class="dlbl">Tue</span><div class="dbar" style="background:#60a5fa;width:44px"></div><span class="dcnt">14</span></div>
    <div class="day"><span class="dlbl">Wed</span><div class="dbar" style="background:#3b82f6;width:18px"></div><span class="dcnt">4</span></div>
    <div class="day"><span class="dlbl">Thu</span><div class="dbar" style="background:#2563eb;width:56px"></div><span class="dcnt">18</span></div>
    <div class="day"><span class="dlbl">Fri</span><div class="dbar" style="background:#1d4ed8;width:38px"></div><span class="dcnt">11</span></div>
    <div class="day"><span class="dlbl">Sat</span><div class="dbar" style="background:#6366f1;width:64px"></div><span class="dcnt">22</span></div>
    <div class="day"><span class="dlbl">Sun</span><div class="dbar" style="background:#8b5cf6;width:48px"></div><span class="dcnt">15</span></div>
  </div>
</div>
</body></html>
