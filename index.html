<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Studio</title>
    <style>
        :root {
            --primary: #6C3CE1;
            --primary-dark: #5429B5;
            --primary-light: #EDE6FB;
            --accent: #00C48C;
            --accent-dark: #00A676;
            --danger: #FF4757;
            --danger-dark: #E0303F;
            --warning: #FFA502;
            --bg: #F4F2F7;
            --surface: #FFFFFF;
            --text: #2D2B33;
            --text-secondary: #7A7786;
            --border: #E2DFE8;
            --shadow: 0 2px 12px rgba(108,60,225,0.08);
            --shadow-lg: 0 8px 32px rgba(108,60,225,0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 16px rgba(108,60,225,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ── Layout ── */
        .app-container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-nav {
            padding: 1rem 0;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 600;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .nav-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            padding: 1.2rem 1.5rem 0.5rem;
            font-weight: 600;
        }

        .project-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 1.5rem 8px 2.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .project-list-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .project-list-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .project-list-item .delete-btn-sm {
            opacity: 0;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
        }

        .project-list-item:hover .delete-btn-sm {
            opacity: 1;
        }

        .project-list-item .delete-btn-sm:hover {
            background: rgba(255, 71, 87, 0.1);
        }

        /* ── Main Content ── */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            min-height: 0;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .page-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(108,60,225,0.3);
        }

        .btn-success {
            background: var(--accent);
            color: white;
        }

        .btn-success:hover {
            background: var(--accent-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-dark);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg);
            color: var(--text);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.78rem;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 1.25rem;
        }

        /* ── Dashboard Stats ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon svg {
            width: 24px;
            height: 24px;
        }

        .stat-icon.purple { background: var(--primary-light); color: var(--primary); }
        .stat-icon.green { background: #E6F9F1; color: var(--accent); }
        .stat-icon.orange { background: #FFF3E0; color: var(--warning); }
        .stat-icon.red { background: #FFE8EA; color: var(--danger); }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ── Tables ── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
            font-weight: 600;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: var(--bg);
        }

        .data-table .actions-cell {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        /* ── Status Badges ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-pass { background: #E6F9F1; color: #00A676; }
        .badge-fail { background: #FFE8EA; color: #E0303F; }
        .badge-pending { background: #FFF3E0; color: #E88F00; }
        .badge-blocked { background: #F0F0F0; color: #888; }

        /* ── Forms / Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 1.1rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .modal-close:hover {
            background: var(--bg);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text);
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-family: inherit;
            transition: border-color 0.15s;
            background: var(--surface);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108,60,225,0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        select.form-control {
            cursor: pointer;
        }

        /* ── Suite Accordion ── */
        .suite-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .suite-header {
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .suite-header:hover {
            background: var(--bg);
        }

        .suite-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .suite-toggle {
            transition: transform 0.2s;
            color: var(--text-secondary);
        }

        .suite-toggle.open {
            transform: rotate(90deg);
        }

        .suite-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .suite-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .suite-header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .suite-body {
            border-top: 1px solid var(--border);
            display: none;
        }

        .suite-body.open {
            display: block;
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .empty-state p {
            font-size: 0.88rem;
            margin-bottom: 1rem;
        }

        /* ── Progress Bar ── */
        .progress-bar {
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .progress-segment {
            height: 100%;
            transition: width 0.3s;
        }

        .progress-segment.pass { background: var(--accent); }
        .progress-segment.fail { background: var(--danger); }
        .progress-segment.pending { background: var(--warning); }
        .progress-segment.blocked { background: #ccc; }

        /* ── Confirm Dialog ── */
        .confirm-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text);
        }

        .confirm-text strong {
            color: var(--danger);
        }

        /* ── Footer ── */
        footer {
            background: linear-gradient(135deg, var(--primary-dark), #3D1A9E);
            color: rgba(255,255,255,0.85);
            text-align: center;
            padding: 14px 2rem;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            margin-top: auto;
            flex-shrink: 0;
        }

        footer span {
            color: white;
            font-weight: 700;
        }

        /* ── Recent Activity ── */
        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .activity-dot.green { background: var(--accent); }
        .activity-dot.purple { background: var(--primary); }
        .activity-dot.red { background: var(--danger); }
        .activity-dot.orange { background: var(--warning); }

        .activity-text {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .activity-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ── Dashboard grid ── */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                width: 220px;
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 60px;
            right: 24px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--text);
            color: white;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.success { border-left: 4px solid var(--accent); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.info { border-left: 4px solid var(--primary); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <svg viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="24" height="24" rx="6" fill="rgba(255,255,255,0.2)"/>
            <path d="M8 14.5L12 18.5L20 10.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        QA Studio
    </div>
    <div class="header-actions">
        <button class="btn btn-ghost" style="color:white;border-color:rgba(255,255,255,0.3)" onclick="exportData()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4 7l4 4 4-4M2 12v2h12v-2"/></svg>
            Export
        </button>
        <button class="btn btn-ghost" style="color:white;border-color:rgba(255,255,255,0.3)" onclick="importData()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2M4 5l4-4 4 4M2 12v2h12v-2"/></svg>
            Import
        </button>
    </div>
</header>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <div class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="7" height="7" rx="1.5"/><rect x="10" y="1" width="7" height="4" rx="1.5"/><rect x="1" y="10" width="7" height="4" rx="1.5"/><rect x="10" y="7" width="7" height="7" rx="1.5"/></svg>
                Dashboard
            </div>
            <div class="nav-section-title">Projects</div>
            <div id="sidebar-projects"></div>
            <div class="nav-item" onclick="openModal('project')" style="color: var(--primary)">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="9" y1="3" x2="9" y2="15"/><line x1="3" y1="9" x2="15" y2="9"/></svg>
                New Project
            </div>
        </nav>
    </aside>

    <!-- Main -->
    <main class="main-content" id="main-content">
        <!-- Dynamic content injected here -->
    </main>
</div>

<footer>
    <span>QA Studio</span> by Milo Haireche — 20+ years of QA expertise
</footer>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Modals -->
<div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
</div>

<!-- Hidden file input for import -->
<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ────────────────────────────────────────
// DATA LAYER — localStorage persistence
// ────────────────────────────────────────
const STORAGE_KEY = 'qa_studio_data';

function getDefaultData() {
    return {
        projects: [],
        activityLog: [],
        idCounter: 1
    };
}

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        // Validate structure
        if (!parsed || !Array.isArray(parsed.projects)) {
            return getDefaultData();
        }
        return parsed;
    } catch (e) {
        console.error('Failed to load data:', e);
        return getDefaultData();
    }
}

function saveData(data) {
    try {
        // Deep clone to avoid reference issues
        const clone = JSON.parse(JSON.stringify(data));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(clone));
    } catch (e) {
        console.error('Failed to save data:', e);
        showToast('Failed to save data!', 'error');
    }
}

let appData = loadData();
let currentView = 'dashboard';
let currentProjectId = null;

function nextId() {
    return appData.idCounter++;
}

function addActivity(text, type = 'purple') {
    appData.activityLog.unshift({
        text,
        type,
        time: new Date().toISOString()
    });
    // Keep last 50 entries
    if (appData.activityLog.length > 50) {
        appData.activityLog = appData.activityLog.slice(0, 50);
    }
}

function getProject(id) {
    return appData.projects.find(p => p.id === id);
}

// ────────────────────────────────────────
// TOAST
// ────────────────────────────────────────
function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ────────────────────────────────────────
// MODAL
// ────────────────────────────────────────
function openModalRaw(html) {
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ────────────────────────────────────────
// PROJECT CRUD
// ────────────────────────────────────────
function openModal(type, editId) {
    if (type === 'project') {
        const existing = editId ? getProject(editId) : null;
        openModalRaw(`
            <div class="modal-header">
                <h3>${existing ? 'Edit' : 'New'} Project</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Project Name *</label>
                    <input class="form-control" id="proj-name" value="${existing ? escHtml(existing.name) : ''}" placeholder="e.g. Mobile App v2.0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea class="form-control" id="proj-desc" placeholder="Brief description...">${existing ? escHtml(existing.description) : ''}</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveProject(${editId || 'null'})">${existing ? 'Update' : 'Create'} Project</button>
            </div>
        `);

function saveCase(projectId, suiteId, editCaseId) {
    const title = document.getElementById('case-title').value.trim();
    if (!title) {
        showToast('Test case title is required', 'error');
        return;
    }

    const proj = getProject(projectId);
    if (!proj) return;
    const suite = proj.suites.find(s => s.id === suiteId);
    if (!suite) return;

    const caseData = {
        title,
        preconditions: document.getElementById('case-precond').value.trim(),
        steps: document.getElementById('case-steps').value.trim(),
        expected: document.getElementById('case-expected').value.trim(),
        priority: document.getElementById('case-priority').value,
        status: document.getElementById('case-status').value
    };

    if (editCaseId) {
        const tc = suite.cases.find(c => c.id === editCaseId);
        if (tc) {
            Object.assign(tc, caseData);
            tc.updatedAt = new Date().toISOString();
            addActivity(`Updated test case "${title}"`, 'purple');
            showToast('Test case updated!', 'success');
        }
    } else {
        suite.cases.push({
            id: nextId(),
            ...caseData,
            createdAt: new Date().toISOString()
        });
        addActivity(`Added test case "${title}" to ${suite.name}`, 'green');
        showToast('Test case created!', 'success');
    }

    saveData(appData);
    closeModal();
    renderCurrentView();
}

function deleteCase(projectId, suiteId, caseId) {
    const proj = getProject(projectId);
    if (!proj) return;
    const suite = proj.suites.find(s => s.id === suiteId);
    if (!suite) return;
    const tc = suite.cases.find(c => c.id === caseId);
    if (!tc) return;

    openModalRaw(`
        <div class="modal-header">
            <h3>Delete Test Case</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">

            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger" onclick="confirmDeleteCase(${projectId}, ${suiteId}, ${caseId})">Delete</button>
        </div>
    `);
}

function confirmDeleteCase(projectId, suiteId, caseId) {
    const proj = getProject(projectId);
    if (!proj) return;
    const suite = proj.suites.find(s => s.id === suiteId);
    if (!suite) return;

    const tc = suite.cases.find(c => c.id === caseId);
    const name = tc ? tc.title : 'Unknown';

    suite.cases = suite.cases.filter(c => c.id !== caseId);

    addActivity(`Deleted test case "${name}"`, 'red');

function quickSetStatus(projectId, suiteId, caseId, status) {
    const proj = getProject(projectId);
    if (!proj) return;
    const suite = proj.suites.find(s => s.id === suiteId);
    if (!suite) return;
    const tc = suite.cases.find(c => c.id === caseId);

    tc.status = status;

function switchView(view, projectId) {
    currentView = view;
    currentProjectId = projectId || null;

    // Update nav active states
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.project-list-item').forEach(el => el.classList.remove('active'));

    if (view === 'dashboard') {
        document.querySelector('[data-view="dashboard"]').classList.add('active');
    } else if (projectId) {
        const projEl = document.querySelector(`[data-project-id="${projectId}"]`);
        if (projEl) projEl.classList.add('active');
    }

    renderCurrentView();
}

function renderCurrentView() {
    if (currentView === 'dashboard') {
        renderDashboard();
    } else if (currentView === 'project' && currentProjectId) {
        renderProject(currentProjectId);
    }
}

function renderSidebar() {
    const container = document.getElementById('sidebar-projects');
    if (appData.projects.length === 0) {
        container.innerHTML = '<div style="padding:8px 1.5rem;font-size:0.8rem;color:var(--text-secondary);font-style:italic">No projects yet</div>';
        return;
    }

    container.innerHTML = appData.projects.map(p => `
        <div class="project-list-item ${currentProjectId === p.id ? 'active' : ''}" data-project-id="${p.id}" onclick="switchView('project', ${p.id})">

function getGlobalStats() {
    let totalProjects = appData.projects.length;
    let totalSuites = 0;
    let totalCases = 0;
    let statusCounts = { pass: 0, fail: 0, pending: 0, blocked: 0 };

    appData.projects.forEach(p => {
        totalSuites += p.suites.length;
        p.suites.forEach(s => {
            totalCases += s.cases.length;
            s.cases.forEach(c => {
                if (statusCounts.hasOwnProperty(c.status)) {
                    statusCounts[c.status]++;
                }
            });
        });
    });

    return { totalProjects, totalSuites, totalCases, statusCounts };
}

    if (!proj) {
        switchView('dashboard');
        return;
    }

    const totalCases = proj.suites.reduce((a, s) => a + s.cases.length, 0);
    const statusCounts = { pass: 0, fail: 0, pending: 0, blocked: 0 };
    proj.suites.forEach(s => s.cases.forEach(c => {
        if (statusCounts.hasOwnProperty(c.status)) statusCounts[c.status]++;
    }));

    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="page-header">
            <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                    <button class="btn btn-ghost btn-sm" onclick="switchView('dashboard')" style="padding:4px 8px">
                        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px"><path d="M9 11L4 7l5-4"/></svg>
                    </button>
                    <div class="page-title">${escHtml(proj.name)}</div>
                </div>
                ${proj.description ? `<div class="page-subtitle" style="margin-left:38px">${escHtml(proj.description)}</div>` : ''}
            </div>
            <div style="display:flex;gap:8px">
                <button class="btn btn-ghost btn-sm" onclick="openModal('project', ${proj.id})">
                    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px"><path d="M10.5 1.5l2 2L4 12H2v-2l8.5-8.5z"/></svg>
                    Edit
                </button>
                <button class="btn btn-primary btn-sm" onclick="openSuiteModal(${proj.id})">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
                    New Suite
                </button>
            </div>
        </div>

        ${totalCases > 0 ? `
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
            <div class="stat-card">
                <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 4L12 14.01l-3-3"/></svg></div>
                <div><div class="stat-value" style="color:var(--accent)">${statusCounts.pass}</div><div class="stat-label">Passed</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
                <div><div class="stat-value" style="color:var(--danger)">${statusCounts.fail}</div><div class="stat-label">Failed</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
                <div><div class="stat-value" style="color:var(--warning)">${statusCounts.pending}</div><div class="stat-label">Pending</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#f0f0f0;color:#888"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="2" rx="1"/></svg></div>
                <div><div class="stat-value" style="color:#888">${statusCounts.blocked}</div><div class="stat-label">Blocked</div></div>
            </div>
        </div>
        ` : ''}

        ${proj.suites.length === 0 ? `
            <div class="card">
                <div class="card-body">
                    <div class="empty-state">
                        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="12" y="8" width="40" height="48" rx="4"/><path d="M22 20h20M22 28h20M22 36h12"/><path d="M32 48l8-8M40 48l-8-8" stroke-width="2.5"/></svg>
                        <h3>No test suites yet</h3>
                        <p>Create a test suite to organize your test cases.</p>
                        <button class="btn btn-primary" onclick="openSuiteModal(${proj.id})">Create First Suite</button>
                    </div>
                </div>
            </div>
        ` : proj.suites.map(s => renderSuiteCard(proj.id, s)).join('')}
    `;
}

function renderSuiteCard(projectId, suite) {
    const caseCount = suite.cases.length;
    const passCount = suite.cases.filter(c => c.status === 'pass').length;
    const failCount = suite.cases.filter(c => c.status === 'fail').length;

    return `
        <div class="suite-card" id="suite-${suite.id}">
            <div class="suite-header" onclick="toggleSuite(${suite.id})">
                <div class="suite-header-left">
                    <svg class="suite-toggle" id="toggle-${suite.id}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M6 3l5 5-5 5"/></svg>
                    <span class="suite-name">${escHtml(suite.name)}</span>
                    <span class="suite-count">${caseCount} case${caseCount !== 1 ? 's' : ''}</span>
                    ${passCount > 0 ? `<span class="badge badge-pass">${passCount} ✓</span>` : ''}
                    ${failCount > 0 ? `<span class="badge badge-fail">${failCount} ✗</span>` : ''}
                </div>
                <div class="suite-header-right" onclick="event.stopPropagation()">
                    <button class="btn btn-primary btn-sm" onclick="openCaseModal(${projectId}, ${suite.id})" title="Add test case">
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
                        Add Case
                    </button>
                    <button class="btn btn-ghost btn-sm" onclick="openSuiteModal(${projectId}, ${suite.id})" title="Edit suite">
                        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px"><path d="M10.5 1.5l2 2L4 12H2v-2l8.5-8.5z"/></svg>
                    </button>
                    <button class="btn btn-ghost btn-sm" onclick="deleteSuite(${projectId}, ${suite.id})" title="Delete suite" style="color:var(--danger)">
                        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px"><path d="M2 4h10M5 4V2.5A.5.5 0 015.5 2h3a.5.5 0 01.5.5V4M11 4v7.5a1 1 0 01-1 1H4a1 1 0 01-1-1V4"/></svg>
                    </button>
                </div>
            </div>
            <div class="suite-body" id="body-${suite.id}">
                ${caseCount === 0 ? `
                    <div style="padding:2rem;text-align:center;color:var(--text-secondary);font-size:0.85rem">
                        No test cases yet.
                        <a href="#" onclick="event.preventDefault(); openCaseModal(${projectId}, ${suite.id})" style="color:var(--primary)">Add one</a>
                    </div>
                ` : `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Test Case</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th style="text-align:right">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${suite.cases.map(c => `
                                <tr>
                                    <td>
                                        <div style="font-weight:500">${escHtml(c.title)}</div>
                                        ${c.steps ? `<div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(c.steps.split('\n')[0])}</div>` : ''}
                                    </td>
                                    <td>
                                        <span class="badge ${c.priority === 'critical' ? 'badge-fail' : c.priority === 'high' ? 'badge-pending' : 'badge-pass'}" style="${c.priority === 'low' ? 'background:#f0f0f0;color:#888' : ''}">
                                            ${c.priority.charAt(0).toUpperCase() + c.priority.slice(1)}
                                        </span>
                                    </td>
                                    <td>
                                        <select class="form-control" style="width:auto;padding:4px 8px;font-size:0.8rem" onchange="quickSetStatus(${projectId}, ${suite.id}, ${c.id}, this.value)">
                                            <option value="pending" ${c.status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                                            <option value="pass" ${c.status === 'pass' ? 'selected' : ''}>✅ Pass</option>
                                            <option value="fail" ${c.status === 'fail' ? 'selected' : ''}>❌ Fail</option>
                                            <option value="blocked" ${c.status === 'blocked' ? 'selected' : ''}>🚫 Blocked</option>
                                        </select>
                                    </td>
                                    <td>
                                        <div class="actions-cell">
                                            <button class="btn btn-ghost btn-sm" onclick="openCaseModal(${projectId}, ${suite.id}, ${c.id})" title="Edit">
                                                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px"><path d="M10.5 1.5l2 2L4 12H2v-2l8.5-8.5z"/></svg>
                                            </button>
                                            <button class="btn btn-ghost btn-sm" onclick="deleteCase(${projectId}, ${suite.id}, ${c.id})" title="Delete" style="color:var(--danger)">
                                                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px"><path d="M2 4h10M5 4V2.5A.5.5 0 015.5 2h3a.5.5 0 01.5.5V4M11 4v7.5a1 1 0 01-1 1H4a1 1 0 01-1-1V4"/></svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `}
            </div>
        </div>
    `;
}

function toggleSuite(suiteId) {
    const body = document.getElementById(`body-${suiteId}`);
    const toggle = document.getElementById(`toggle-${suiteId}`);
    if (body && toggle) {
        body.classList.toggle('open');
        toggle.classList.toggle('open');
    }
}

// ────────────────────────────────────────
// EXPORT / IMPORT
// ────────────────────────────────────────
function exportData() {
    const dataStr = JSON.stringify(appData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `qa-studio-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Data exported successfully!', 'success');
}

function importData() {
    document.getElementById('import-input').click();
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (!imported || !Array.isArray(imported.projects)) {
                showToast('Invalid file format', 'error');
                return;
            }
            appData = imported;
            saveData(appData);
            renderSidebar();
            switchView('dashboard');
            showToast(`Imported ${appData.projects.length} project(s)!`, 'success');
        } catch (err) {
            showToast('Failed to parse file', 'error');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ────────────────────────────────────────
// HELPERS
// ────────────────────────────────────────
function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function timeAgo(isoString) {
    const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d ago`;
    return new Date(isoString).toLocaleDateString();
}

// ────────────────────────────────────────
// INIT
// ────────────────────────────────────────
renderSidebar();
renderDashboard();
</script>
