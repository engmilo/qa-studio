<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Studio — AI Test Case Generator</title>
<style>
/* ═══════════════════════════════════════
   THEME VARIABLES
   ═══════════════════════════════════════ */
:root[data-theme="light"] {
  --bg-primary: #f5f6fa;
  --bg-secondary: #ffffff;
  --bg-sidebar: #1a1a2e;
  --bg-sidebar-hover: #252542;
  --bg-sidebar-active: #4f46e5;
  --bg-input: #ffffff;
  --bg-card: #ffffff;
  --bg-tag: #f0f0f5;
  --bg-tag-hover: #e0e0ee;
  --bg-code: #f8f9fc;
  --text-primary: #1a1a2e;
  --text-secondary: #6b7280;
  --text-sidebar: #a0a0b8;
  --text-sidebar-active: #ffffff;
  --text-on-primary: #ffffff;
  --border-color: #e5e7eb;
  --border-light: #f0f0f5;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-light: #eef2ff;
  --success: #10b981;
  --success-bg: #ecfdf5;
  --warning: #f59e0b;
  --warning-bg: #fffbeb;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
  --danger-hover: #dc2626;
  --info: #3b82f6;
  --info-bg: #eff6ff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
}

:root[data-theme="dark"] {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-sidebar: #0d0d1a;
  --bg-sidebar-hover: #1a1a30;
  --bg-sidebar-active: #4f46e5;
  --bg-input: #252540;
  --bg-card: #1e1e35;
  --bg-tag: #252542;
  --bg-tag-hover: #30304a;
  --bg-code: #151528;
  --text-primary: #e5e5f0;
  --text-secondary: #8888a0;
  --text-sidebar: #7070a0;
  --text-sidebar-active: #ffffff;
  --text-on-primary: #ffffff;
  --border-color: #2a2a45;
  --border-light: #222240;
  --accent: #6366f1;
  --accent-hover: #5558e8;
  --accent-light: #1e1b4b;
  --success: #34d399;
  --success-bg: #0d3320;
  --warning: #fbbf24;
  --warning-bg: #3d2e00;
  --danger: #f87171;
  --danger-bg: #3b1010;
  --danger-hover: #ef4444;
  --info: #60a5fa;
  --info-bg: #0c2340;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
}

/* ═══════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  min-height: 100vh;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════ */
.sidebar {
  width: 210px;
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  position: sticky;
  top: 0;
  z-index: 50;
}

.sidebar-logo {
  padding: 20px 22px;
  font-size: 1.2rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-logo .logo-icon {
  width: 26px;
  height: 26px;
  background: var(--accent);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-nav {
  flex: 1;
  padding: 0 10px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 16px;
  border: none;
  background: transparent;
  color: var(--text-sidebar);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.15s;
  text-align: left;
  margin-bottom: 2px;
}

.nav-btn:hover {
  background: var(--bg-sidebar-hover);
  color: #d0d0e8;
}

.nav-btn.active {
  background: var(--bg-sidebar-active);
  color: var(--text-sidebar-active);
  font-weight: 600;
}

.nav-btn svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  stroke-width: 1.8;
}

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.sidebar-stat {
  font-size: 0.78rem;
  color: var(--text-sidebar);
  margin-bottom: 10px;
  text-align: center;
}

.lang-select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  background: var(--bg-sidebar-hover);
  color: var(--text-sidebar);
  font-size: 0.82rem;
  cursor: pointer;
  margin-bottom: 8px;
  appearance: auto;
}

.theme-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--text-sidebar);
  font-size: 0.85rem;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.15s;
}

.theme-toggle:hover {
  background: var(--bg-sidebar-hover);
}

.theme-toggle svg {
  width: 18px;
  height: 18px;
}

/* ═══════════════════════════════════════
   MAIN
   ═══════════════════════════════════════ */
.main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px 20px;
}

/* ═══════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════ */
.app-footer {
  background: var(--bg-sidebar);
  color: rgba(255,255,255,0.65);
  text-align: center;
  padding: 12px 24px;
  font-size: 0.8rem;
  font-weight: 400;
  flex-shrink: 0;
  letter-spacing: 0.2px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

.app-footer strong {
  color: #fff;
  font-weight: 700;
}

.app-footer .sep {
  color: var(--accent);
  margin: 0 2px;
}

/* ═══════════════════════════════════════
   PAGE HEADERS
   ═══════════════════════════════════════ */
.page-header {
  margin-bottom: 6px;
}

.page-title {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text-primary);
}

.page-desc {
  font-size: 0.92rem;
  color: var(--text-secondary);
  margin-top: 4px;
  margin-bottom: 20px;
}

/* ═══════════════════════════════════════
   LIVE PREVIEW BAR
   ═══════════════════════════════════════ */
.preview-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 10px 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.preview-badge {
  background: var(--accent);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 4px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  white-space: nowrap;
}

.preview-text {
  font-size: 0.9rem;
  color: var(--text-secondary);
  font-family: 'Courier New', monospace;
}

/* ═══════════════════════════════════════
   GENERATOR CARD
   ═══════════════════════════════════════ */
.gen-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-sm);
}

.quick-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.quick-tag {
  padding: 6px 16px;
  border: 1px solid var(--border-color);
  border-radius: 20px;
  background: var(--bg-tag);
  color: var(--text-secondary);
  font-size: 0.84rem;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.quick-tag:hover {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
}

.gen-textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px 16px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius);
  font-size: 0.92rem;
  font-family: inherit;
  resize: vertical;
  background: var(--bg-input);
  color: var(--text-primary);
  transition: border-color 0.2s;
  line-height: 1.6;
}

.gen-textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

.char-count {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 6px;
  margin-bottom: 16px;
}

.gen-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ═══════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 18px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg-card);
  color: var(--text-primary);
  white-space: nowrap;
}

.btn svg { width: 16px; height: 16px; }

.btn:hover {
  background: var(--bg-tag-hover);
  box-shadow: var(--shadow-sm);
}

.btn-primary {
  background: var(--accent);
  color: var(--text-on-primary);
  border-color: var(--accent);
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(79,70,229,0.35);
}

.btn-success {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}

.btn-success:hover {
  opacity: 0.9;
}

.btn-danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

.btn-danger:hover {
  background: var(--danger-hover);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background: var(--bg-tag);
  color: var(--text-primary);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.8rem;
}

.btn-xs {
  padding: 4px 8px;
  font-size: 0.75rem;
}

.btn-icon {
  padding: 6px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-icon:hover { background: var(--bg-tag); color: var(--text-primary); }
.btn-icon.danger:hover { background: var(--danger-bg); color: var(--danger); }

/* ═══════════════════════════════════════
   RESULTS TABLE
   ═══════════════════════════════════════ */
.results-section {
  margin-top: 28px;
}

.results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.results-title {
  font-size: 1.15rem;
  font-weight: 700;
}

.results-count {
  font-size: 0.82rem;
  color: var(--text-secondary);
  background: var(--bg-tag);
  padding: 3px 12px;
  border-radius: 12px;
  margin-left: 10px;
  font-weight: 500;
}

.results-table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.results-table {
  width: 100%;
  border-collapse: collapse;
}

.results-table th {
  text-align: left;
  font-size: 0.73rem;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
  padding: 12px 14px;
  border-bottom: 2px solid var(--border-color);
  font-weight: 700;
  background: var(--bg-tag);
}

.results-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-light);
  font-size: 0.86rem;
  vertical-align: top;
}

.results-table tr:last-child td { border-bottom: none; }
.results-table tr:hover td { background: var(--accent-light); }

.results-table .id-col { width: 60px; font-weight: 600; color: var(--accent); }
.results-table .priority-col { width: 85px; }
.results-table .type-col { width: 100px; }
.results-table .actions-col { width: 70px; text-align: right; }

/* ═══════════════════════════════════════
   BADGES
   ═══════════════════════════════════════ */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.badge-high, .badge-critical { background: var(--danger-bg); color: var(--danger); }
.badge-medium { background: var(--warning-bg); color: var(--warning); }
.badge-low { background: var(--success-bg); color: var(--success); }
.badge-positive { background: var(--success-bg); color: var(--success); }
.badge-negative { background: var(--danger-bg); color: var(--danger); }
.badge-edge { background: var(--warning-bg); color: var(--warning); }
.badge-security { background: var(--info-bg); color: var(--info); }
.badge-pass { background: var(--success-bg); color: var(--success); }
.badge-fail { background: var(--danger-bg); color: var(--danger); }
.badge-pending { background: var(--warning-bg); color: var(--warning); }
.badge-blocked { background: var(--bg-tag); color: var(--text-secondary); }

/* ═══════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 14px;
}

.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.stat-icon svg { width: 22px; height: 22px; }
.stat-icon.purple { background: var(--accent-light); color: var(--accent); }
.stat-icon.green { background: var(--success-bg); color: var(--success); }
.stat-icon.orange { background: var(--warning-bg); color: var(--warning); }
.stat-icon.red { background: var(--danger-bg); color: var(--danger); }
.stat-icon.blue { background: var(--info-bg); color: var(--info); }

.stat-value {
  font-size: 1.7rem;
  font-weight: 800;
  line-height: 1;
}

.stat-label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 3px;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

@media (max-width: 960px) {
  .dashboard-grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 0.95rem;
}

.card-body { padding: 16px 18px; }
.card-body.no-pad { padding: 0; }

/* ═══════════════════════════════════════
   PROJECTS & SUITES LIST
   ═══════════════════════════════════════ */
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-light);
  transition: background 0.1s;
}

.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--accent-light); }

.list-item-info { flex: 1; min-width: 0; }
.list-item-name {
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.list-item-meta {
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.list-item-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s;
}

.list-item:hover .list-item-actions { opacity: 1; }

/* ═══════════════════════════════════════
   PROGRESS BAR
   ═══════════════════════════════════════ */
.progress-bar {
  height: 7px;
  background: var(--bg-tag);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
}

.progress-seg { height: 100%; transition: width 0.4s; }
.progress-seg.pass { background: var(--success); }
.progress-seg.fail { background: var(--danger); }
.progress-seg.pending { background: var(--warning); }
.progress-seg.blocked { background: #aaa; }

/* ═══════════════════════════════════════
   MODAL
   ═══════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(4px);
}

.modal-overlay.hidden { display: none; }

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 92%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
}

.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 { font-size: 1.1rem; font-weight: 700; }

.modal-body { padding: 22px; }

.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  margin-bottom: 5px;
}

.form-control {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-family: inherit;
  background: var(--bg-input);
  color: var(--text-primary);
  transition: border-color 0.15s;
}

.form-control:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

textarea.form-control { resize: vertical; min-height: 70px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ═══════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════ */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

.empty-state svg { width: 56px; height: 56px; opacity: 0.3; margin-bottom: 14px; }
.empty-state h3 { font-size: 1.05rem; color: var(--text-primary); margin-bottom: 6px; }
.empty-state p { font-size: 0.88rem; margin-bottom: 16px; }

/* ═══════════════════════════════════════
   TOAST
   ═══════════════════════════════════════ */
.toast-wrap {
  position: fixed;
  bottom: 50px;
  right: 24px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--bg-sidebar);
  color: #fff;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.info { border-left: 4px solid var(--accent); }

@keyframes toastIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ═══════════════════════════════════════
   HISTORY
   ═══════════════════════════════════════ */
.history-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-light);
}
.history-item:last-child { border-bottom: none; }

.history-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
}

.history-dot.green { background: var(--success); }
.history-dot.purple { background: var(--accent); }
.history-dot.red { background: var(--danger); }
.history-dot.orange { background: var(--warning); }
.history-dot.blue { background: var(--info); }

.history-text { font-size: 0.87rem; line-height: 1.45; }
.history-time { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

/* ═══════════════════════════════════════
   SCROLLBAR
   ═══════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ═══════════════════════════════════════
   SUITE ACCORDION
   ═══════════════════════════════════════ */
.suite-accordion {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.suite-acc-header {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: background 0.1s;
}

.suite-acc-header:hover { background: var(--bg-tag); }

.suite-acc-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.suite-acc-toggle {
  transition: transform 0.2s;
  color: var(--text-secondary);
  width: 16px;
  height: 16px;
}

.suite-acc-toggle.open { transform: rotate(90deg); }

.suite-acc-body {
  border-top: 1px solid var(--border-color);
  display: none;
}

.suite-acc-body.open { display: block; }
</style>
</head>
<body>

<!-- ═══════ SIDEBAR ═══════ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10.5L9 14.5L15 6.5"/></svg>
    </div>

  <nav class="sidebar-nav">

    </button>
    <button class="nav-btn" data-page="dashboard" onclick="navigate('dashboard')">

  </nav>

  <div class="sidebar-footer">

    <select class="lang-select" id="lang-select">
      <option value="en">🌐 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="ar">🇸🇦 العربية</option>

    <button class="theme-toggle" onclick="toggleTheme()">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      Theme
    </button>
  </div>

<!-- ═══════ MAIN ═══════ -->
<div class="main-wrap">
  <main class="main-content" id="main-content"></main>
  <footer class="app-footer">
    <strong>QA Studio</strong> by Milo Haireche <span class="sep">—</span> 20+ years of QA expertise
  </footer>
</div>

<!-- ═══════ MODAL ═══════ -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<!-- ═══════ TOAST ═══════ -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ════════════════════════════════════════════
// DATA LAYER
// ════════════════════════════════════════════
const STORE_KEY = 'qa_studio_data_v2';

function defaultData() {
  return {
    projects: [],
    generatedCases: [],
    history: [],
    idSeq: 1,
    totalGenerated: 0
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultData();
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.projects)) return defaultData();
    // Ensure all needed arrays exist
    if (!Array.isArray(d.generatedCases)) d.generatedCases = [];
    if (!Array.isArray(d.history)) d.history = [];
    if (!d.idSeq) d.idSeq = 1;
    if (!d.totalGenerated) d.totalGenerated = 0;
    return d;
  } catch(e) {
    return defaultData();
  }
}

function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch(e) {
    console.error('Save failed', e);
  }
}

let store = loadStore();
let currentPage = 'generator';

function nextId() { return store.idSeq++; }

function addHistory(text, type='purple') {
  store.history.unshift({ text, type, time: new Date().toISOString() });
  if (store.history.length > 100) store.history.length = 100;
}

function getProject(id) {
  return store.projects.find(p => p.id === id);
}

function getSuite(projectId, suiteId) {
  const p = getProject(projectId);
  return p ? p.suites.find(s => s.id === suiteId) : null;
}

function updateSidebarStat() {
  document.getElementById('sidebar-stat').textContent = store.totalGenerated + ' test cases generated';
}

// ════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════
function toast(msg, type='info') {
  const c = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(100%)';
    t.style.transition = 'all 0.3s';
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

// ════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  renderPage();
}

function renderPage() {
  const main = document.getElementById('main-content');
  main.scrollTop = 0;
  switch(currentPage) {
    case 'generator':  renderGenerator(main); break;
    case 'dashboard':  renderDashboard(main); break;
    case 'projects':   renderProjects(main); break;
    case 'suites':     renderSuites(main); break;
    case 'history':    renderHistory(main); break;
    default:           renderGenerator(main);
  }
  updateSidebarStat();
}

// ════════════════════════════════════════════
// HELPER
// ════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function timeAgo(iso) {
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + 'm ago';
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + 'd ago';
  return new Date(iso).toLocaleDateString();
}

// ════════════════════════════════════════════
// THEME
// ════════════════════════════════════════════
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('qa_theme', next);
}

(function initTheme() {
  const saved = localStorage.getItem('qa_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();

// ════════════════════════════════════════════
// GENERATOR PAGE
// ════════════════════════════════════════════
const QUICK_TAGS = ['Login flow', 'Password reset', 'File upload', 'Search & filter', 'User registration', 'Checkout', 'API CRUD', 'Form validation', 'Pagination', 'Profile edit'];

const TEST_TEMPLATES = {
  positive: [
    { suffix: 'with valid data', priority: 'high', type: 'positive' },
    { suffix: 'with all required fields filled', priority: 'high', type: 'positive' },
    { suffix: 'successfully completes flow', priority: 'critical', type: 'positive' },
    { suffix: 'shows success confirmation', priority: 'medium', type: 'positive' },
  ],
  negative: [
    { suffix: 'with empty required fields', priority: 'high', type: 'negative' },
    { suffix: 'with invalid format data', priority: 'high', type: 'negative' },
    { suffix: 'with SQL injection attempt', priority: 'critical', type: 'security' },
    { suffix: 'with XSS payload', priority: 'critical', type: 'security' },
    { suffix: 'with unauthorized access', priority: 'high', type: 'security' },
    { suffix: 'with expired session', priority: 'medium', type: 'negative' },
  ],
  edge: [
    { suffix: 'with maximum length input', priority: 'medium', type: 'edge' },
    { suffix: 'with special characters', priority: 'medium', type: 'edge' },
    { suffix: 'with concurrent requests', priority: 'low', type: 'edge' },
    { suffix: 'with slow network connection', priority: 'low', type: 'edge' },
    { suffix: 'on mobile viewport', priority: 'medium', type: 'edge' },
  ]
};

function generateTestCases(feature) {
  if (!feature.trim()) return [];
  const cases = [];
  const feat = feature.trim();
  let id = 1;

  // Generate from templates
  Object.values(TEST_TEMPLATES).forEach(group => {
    group.forEach(tmpl => {
      const steps = generateSteps(feat, tmpl);
      cases.push({
        id: nextId(),
        localId: 'TC-' + String(id++).padStart(3, '0'),
        title: `Verify ${feat} ${tmpl.suffix}`,
        steps: steps.steps,
        expected: steps.expected,
        priority: tmpl.priority,
        type: tmpl.type,
        status: 'pending',
        feature: feat,
        createdAt: new Date().toISOString()
      });
    });
  });

  return cases;
}

function generateSteps(feat, tmpl) {
  const stepSets = {
    positive: {
      steps: `1. Navigate to the ${feat} page\n2. Enter valid data in all required fields\n3. Submit the form / trigger the action\n4. Verify the operation completes`,
      expected: `The ${feat} operation should complete successfully with appropriate success message.`
    },
    negative: {
      steps: `1. Navigate to the ${feat} page\n2. ${tmpl.suffix.includes('empty') ? 'Leave required fields empty' : 'Enter invalid / malicious data'}\n3. Attempt to submit\n4. Verify error handling`,
      expected: `Appropriate error messages should be displayed. No data corruption should occur.`
    },
    edge: {
      steps: `1. Navigate to the ${feat} page\n2. Set up edge case condition: ${tmpl.suffix}\n3. Perform the operation\n4. Verify behavior under edge condition`,
      expected: `The system should handle the edge case gracefully without crashes or data loss.`
    },
    security: {
      steps: `1. Navigate to the ${feat} page\n2. Attempt ${tmpl.suffix}\n3. Monitor system response\n4. Verify security controls`,
      expected: `The system should block the attack vector and log the security event. No unauthorized access granted.`
    }
  };
  return stepSets[tmpl.type] || stepSets.positive;
}

function renderGenerator(el) {
  const cases = store.generatedCases || [];

  el.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">AI Test Case Generator</h1>
    </div>
    <p class="page-desc">Generate, save, and track test cases by project.</p>

    <div class="preview-bar">
      <span class="preview-badge">// LIVE PREVIEW</span>
      <span class="preview-text" id="preview-text">AI</span>
    </div>

    <div class="gen-card">
      <div class="quick-tags">
        ${QUICK_TAGS.map(t => `<button class="quick-tag" onclick="insertTag('${esc(t)}')">${esc(t)}</button>`).join('')}
      </div>
      <textarea class="gen-textarea" id="gen-input" placeholder="Describe the feature you want test cases for..." oninput="updatePreview()">${cases.length > 0 && cases[0].feature ? esc(cases[0].feature) : ''}</textarea>
      <div class="char-count" id="char-count">0 characters</div>
      <div class="gen-actions">
        <button class="btn btn-primary" onclick="handleGenerate()">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
          Generate Test Cases
        </button>
        <button class="btn" onclick="handleExport('json')">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 13V5a2 2 0 012-2h5l4 4v6a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M11 3v4h4"/></svg>
          {} Export JSON
        </button>
        <button class="btn" onclick="handleExport('csv')">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="14" height="14" rx="2"/><path d="M2 7h14M2 12h14M7 2v14M12 2v14"/></svg>
          Export CSV
        </button>
        <button class="btn" onclick="handleExport('excel')">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="14" height="14" rx="2"/><path d="M5 5l8 8M13 5l-8 8"/></svg>
          Export Excel
        </button>
        <button class="btn" onclick="handleExport('word')">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 14V4a2 2 0 012-2h6a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M7 7h4M7 10h4M7 13h2"/></svg>
          Export Word
        </button>
        <button class="btn" onclick="openSaveToProjectModal()">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5l5-3 7 4v8l-7 3-5-4V5z"/><path d="M8 2v10"/></svg>
          Save to Project
        </button>
      </div>
    </div>

    ${cases.length > 0 ? `
    <div class="results-section">
      <div class="results-header">
        <div style="display:flex;align-items:center">
          <span class="results-title">Generated Test Cases</span>
          <span class="results-count">${cases.length}</span>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="clearGenerated()" style="color:var(--danger)">Clear All</button>
      </div>
      <div class="results-table-wrap">
        <table class="results-table">
          <thead>
            <tr>
              <th class="id-col">ID</th>
              <th>Title</th>
              <th class="priority-col">Priority</th>
              <th class="type-col">Type</th>
              <th class="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            ${cases.map(c => `
            <tr>
              <td class="id-col">${esc(c.localId)}</td>
              <td>
                <div style="font-weight:500">${esc(c.title)}</div>
                <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:3px;white-space:pre-line;max-height:40px;overflow:hidden">${esc(c.steps)}</div>
              </td>
              <td><span class="badge badge-${c.priority}">${c.priority}</span></td>
              <td><span class="badge badge-${c.type}">${c.type}</span></td>
              <td>
                <button class="btn-icon" onclick="viewCase(${c.id})" title="View details">
                  <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px"><circle cx="9" cy="9" r="3"/><path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/></svg>
                </button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}
  `;

  // Update char count
  const input = document.getElementById('gen-input');
  if (input) {
    document.getElementById('char-count').textContent = input.value.length + ' characters';
  }
}

function insertTag(tag) {
  const input = document.getElementById('gen-input');
  if (input) {
    input.value = tag;
    input.focus();
    updatePreview();
  }
}

function updatePreview() {
  const input = document.getElementById('gen-input');
  const preview = document.getElementById('preview-text');
  const charCount = document.getElementById('char-count');
  if (input && preview) {
    preview.textContent = input.value || 'AI';
  }
  if (input && charCount) {
    charCount.textContent = input.value.length + ' characters';
  }
}

function handleGenerate() {
  const input = document.getElementById('gen-input');
  if (!input || !input.value.trim()) {
    toast('Please describe a feature first', 'error');
    return;
  }

  const cases = generateTestCases(input.value);
  store.generatedCases = cases;
  store.totalGenerated += cases.length;
  addHistory(`Generated ${cases.length} test cases for "${input.value.trim()}"`, 'green');
  saveStore();
  toast(`Generated ${cases.length} test cases!`, 'success');
  renderPage();
}

function clearGenerated() {
  store.generatedCases = [];
  saveStore();
  renderPage();
}

function viewCase(id) {
  const c = store.generatedCases.find(x => x.id === id);
  if (!c) return;
  openModal(`
    <div class="modal-header">
      <h3>${esc(c.localId)} — Details</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>Title</label><div style="padding:8px 0">${esc(c.title)}</div></div>
      <div class="form-group"><label>Steps</label><div style="padding:8px 0;white-space:pre-line;font-size:0.88rem">${esc(c.steps)}</div></div>
      <div class="form-group"><label>Expected Result</label><div style="padding:8px 0;font-size:0.88rem">${esc(c.expected)}</div></div>
      <div class="form-row">
        <div class="form-group"><label>Priority</label><div style="padding:8px 0"><span class="badge badge-${c.priority}">${c.priority}</span></div></div>
        <div class="form-group"><label>Type</label><div style="padding:8px 0"><span class="badge badge-${c.type}">${c.type}</span></div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  `);
}

// ════════════════════════════════════════════
// SAVE TO PROJECT
// ════════════════════════════════════════════
function openSaveToProjectModal() {
  if (!store.generatedCases || store.generatedCases.length === 0) {
    toast('Generate test cases first', 'error');
    return;
  }

  const projOptions = store.projects.length === 0
    ? '<option value="">— No projects. Create one first —</option>'
    : store.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');

  openModal(`
    <div class="modal-header">
      <h3>Save to Project</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Select Project</label>
        <select class="form-control" id="save-proj-id" onchange="updateSuiteSelect()">
          ${projOptions}
        </select>
      </div>
      <div class="form-group">
        <label>Select Suite (or create new)</label>
        <select class="form-control" id="save-suite-id">
          <option value="__new__">+ Create New Suite</option>
        </select>
      </div>
      <div class="form-group" id="new-suite-group">
        <label>New Suite Name</label>
        <input class="form-control" id="save-suite-name" placeholder="e.g. Regression Tests">
      </div>
      <p style="font-size:0.85rem;color:var(--text-secondary)">${store.generatedCases.length} test cases will be saved.</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="executeSaveToProject()">Save</button>
    </div>
  `);

  updateSuiteSelect();
}

function updateSuiteSelect() {
  const projSelect = document.getElementById('save-proj-id');
  const suiteSelect = document.getElementById('save-suite-id');
  if (!projSelect || !suiteSelect) return;

  const projId = parseInt(projSelect.value);
  const proj = getProject(projId);

  let html = '<option value="__new__">+ Create New Suite</option>';
  if (proj) {
    proj.suites.forEach(s => {
      html += `<option value="${s.id}">${esc(s.name)}</option>`;
    });
  }
  suiteSelect.innerHTML = html;
}

function executeSaveToProject() {
  const projId = parseInt(document.getElementById('save-proj-id').value);
  const suiteVal = document.getElementById('save-suite-id').value;
  const newSuiteName = document.getElementById('save-suite-name').value.trim();

  const proj = getProject(projId);
  if (!proj) {
    toast('Please select a valid project', 'error');
    return;
  }

  let suite;
  if (suiteVal === '__new__') {
    if (!newSuiteName) {
      toast('Enter a suite name', 'error');
      return;
    }
    suite = {
      id: nextId(),
      name: newSuiteName,
      description: '',
      cases: [],
      createdAt: new Date().toISOString()
    };
    proj.suites.push(suite);
  } else {
    suite = proj.suites.find(s => s.id === parseInt(suiteVal));
    if (!suite) {
      toast('Suite not found', 'error');
      return;
    }
  }

  // Deep clone generated cases into the suite
  const casesToSave = JSON.parse(JSON.stringify(store.generatedCases));
  casesToSave.forEach(c => {
    c.id = nextId(); // new unique IDs to avoid conflicts
    suite.cases.push(c);
  });

  addHistory(`Saved ${casesToSave.length} cases to "${suite.name}" in "${proj.name}"`, 'green');
  saveStore();
  closeModal();
  toast(`Saved ${casesToSave.length} cases to ${proj.name} / ${suite.name}!`, 'success');

  // KEY FIX: Do NOT clear generatedCases or navigate away
  // Just stay on the current page, dashboard data remains intact
}

// EXPORT HANDLERS
// ════════════════════════════════════════════
function handleExport(format) {
  const cases = store.generatedCases || [];
  if (cases.length === 0) {
    toast('Generate test cases first', 'error');
    return;
  }

  let content, filename, mime;

  switch(format) {
    case 'json':
      content = JSON.stringify(cases, null, 2);
      filename = 'test-cases.json';
      mime = 'application/json';
      break;
    case 'csv':
      content = 'ID,Title,Steps,Expected,Priority,Type,Status\n' +
        cases.map(c => `"${c.localId}","${c.title.replace(/"/g,'""')}","${(c.steps||'').replace(/"/g,'""')}","${(c.expected||'').replace(/"/g,'""')}","${c.priority}","${c.type}","${c.status}"`).join('\n');
      filename = 'test-cases.csv';
      mime = 'text/csv';
      break;
    case 'excel':
      // Simple HTML table that Excel can open
      content = '<html><head><meta charset="utf-8"></head><body><table border="1">' +
        '<tr><th>ID</th><th>Title</th><th>Steps</th><th>Expected</th><th>Priority</th><th>Type</th></tr>' +
        cases.map(c => `<tr><td>${esc(c.localId)}</td><td>${esc(c.title)}</td><td>${esc(c.steps)}</td><td>${esc(c.expected)}</td><td>${c.priority}</td><td>${c.type}</td></tr>`).join('') +
        '</table></body></html>';
      filename = 'test-cases.xls';
      mime = 'application/vnd.ms-excel';
      break;
    case 'word':
      content = '<html><head><meta charset="utf-8"><style>body{font-family:Arial;}h2{color:#4f46e5;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f0f0f5;}</style></head><body>' +
        '<h1>QA Studio — Test Cases</h1><p>Generated: ' + new Date().toLocaleDateString() + '</p>' +
        '<table><tr><th>ID</th><th>Title</th><th>Steps</th><th>Expected</th><th>Priority</th><th>Type</th></tr>' +
        cases.map(c => `<tr><td>${esc(c.localId)}</td><td>${esc(c.title)}</td><td>${esc(c.steps)}</td><td>${esc(c.expected)}</td><td>${c.priority}</td><td>${c.type}</td></tr>`).join('') +
        '</table></body></html>';
      filename = 'test-cases.doc';
      mime = 'application/msword';
      break;
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast(`Exported as ${format.toUpperCase()}!`, 'success');
}

function getDashboardStats() {
  let totalProjects = store.projects.length;
  let totalSuites = 0;
  let totalCases = 0;
  let counts = { pass:0, fail:0, pending:0, blocked:0 };

  store.projects.forEach(p => {
    totalSuites += p.suites.length;
    p.suites.forEach(s => {
      totalCases += s.cases.length;
      s.cases.forEach(c => {
        if (counts.hasOwnProperty(c.status)) counts[c.status]++;
      });
    });
  });

  const passRate = totalCases > 0 ? Math.round((counts.pass / totalCases) * 100) : 0;
  return { totalProjects, totalSuites, totalCases, counts, passRate };
}

          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><circle cx="32" cy="32" r="24"/><path d="M32 16v16l10 6"/></svg>
          <h3>No activity yet</h3>
          <p>Your actions will appear here.</p>
        </div>
      ` : store.history.map(h => `
        <div class="history-item">
          <div class="history-dot ${h.type}"></div>
          <div>
            <div class="history-text">${esc(h.text)}</div>
            <div class="history-time">${timeAgo(h.time)}</div>
          </div>
        </div>
      `).join('')}
    </div></div>
  `;
}

function clearHistory() {
  store.history = [];
  saveStore();
  renderPage();
  toast('History cleared', 'info');
}

// ════════════════════════════════════════════
// PROJECT CRUD
// ════════════════════════════════════════════
function openProjectModal(editId) {
  const existing = editId ? getProject(editId) : null;
  openModal(`
    <div class="modal-header">
      <h3>${existing ? 'Edit' : 'New'} Project</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Project Name *</label>
        <input class="form-control" id="f-proj-name" value="${existing ? esc(existing.name) : ''}" placeholder="e.g. Mobile App v2.0">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" id="f-proj-desc" placeholder="Brief description...">${existing ? esc(existing.description || '') : ''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject(${editId || 'null'})">${existing ? 'Update' : 'Create'}</button>
    </div>
  `);
  setTimeout(() => document.getElementById('f-proj-name')?.focus(), 100);
}

function editProject(id) {
  openProjectModal(id);
}

function saveProject(editId) {
  const name = document.getElementById('f-proj-name').value.trim();
  const desc = document.getElementById('f-proj-desc').value.trim();
  if (!name) { toast('Project name is required', 'error'); return; }

  if (editId !== null && editId !== undefined) {
    const p = getProject(editId);
    if (p) {
      p.name = name;
      p.description = desc;
      addHistory(`Updated project "${name}"`, 'purple');
      toast('Project updated!', 'success');
    }
  } else {
    store.projects.push({
      id: nextId(),
      name: name,
      description: desc,
      suites: [],
      createdAt: new Date().toISOString()
    });
    addHistory(`Created project "${name}"`, 'green');
    toast('Project created!', 'success');
  }

  saveStore();
  closeModal();
  renderPage();
}

// ██████████████████████████████████████████
// FIX: DELETE PROJECT — properly removes from array
// ██████████████████████████████████████████
function deleteProject(id) {
  const proj = getProject(id);
  if (!proj) return;

  openModal(`
    <div class="modal-header">
      <h3>Delete Project</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:0.95rem;line-height:1.6">Are you sure you want to permanently delete <strong style="color:var(--danger)">"${esc(proj.name)}"</strong>?</p>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:8px">This will remove ${proj.suites.length} suite(s) and all associated test cases. This action cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="executeDeleteProject(${id})">Delete Project</button>
    </div>
  `);
}

function executeDeleteProject(id) {
  const proj = getProject(id);
  const projName = proj ? proj.name : 'Unknown';

  // *** FIX: Use filter and REASSIGN the array ***
  store.projects = store.projects.filter(p => p.id !== id);

  addHistory(`Deleted project "${projName}"`, 'red');
  saveStore();
  closeModal();

  // If we were viewing this project, go back
  if (viewingProjectId === id) {
    viewingProjectId = null;
    currentPage = 'projects';
  }

  renderPage();
  toast('Project deleted!', 'success');
}

// ════════════════════════════════════════════
// SUITE CRUD
// ════════════════════════════════════════════
function openSuiteModal(projectId, editSuiteId) {
  const proj = getProject(projectId);
  if (!proj) return;
  const existing = editSuiteId ? proj.suites.find(s => s.id === editSuiteId) : null;

  openModal(`
    <div class="modal-header">
      <h3>${existing ? 'Edit' : 'New'} Test Suite</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Suite Name *</label>
        <input class="form-control" id="f-suite-name" value="${existing ? esc(existing.name) : ''}" placeholder="e.g. Login Tests">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" id="f-suite-desc" placeholder="What does this suite cover?">${existing ? esc(existing.description || '') : ''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSuite(${projectId}, ${editSuiteId || 'null'})">${existing ? 'Update' : 'Create'}</button>
    </div>
  `);
  setTimeout(() => document.getElementById('f-suite-name')?.focus(), 100);
}

function saveSuite(projectId, editSuiteId) {
  const name = document.getElementById('f-suite-name').value.trim();
  const desc = document.getElementById('f-suite-desc').value.trim();
  if (!name) { toast('Suite name is required', 'error'); return; }

  const proj = getProject(projectId);
  if (!proj) return;

  if (editSuiteId !== null && editSuiteId !== undefined) {
    const suite = proj.suites.find(s => s.id === editSuiteId);
    if (suite) {
      suite.name = name;
      suite.description = desc;
      addHistory(`Updated suite "${name}" in ${proj.name}`, 'purple');
      toast('Suite updated!', 'success');
    }
  } else {
    proj.suites.push({
      id: nextId(),
      name: name,
      description: desc,
      cases: [],
      createdAt: new Date().toISOString()
    });
    addHistory(`Created suite "${name}" in ${proj.name}`, 'green');
    toast('Suite created!', 'success');
  }

  saveStore();
  closeModal();
  renderPage();
}

// ██████████████████████████████████████████
// FIX: DELETE SUITE — properly removes from array
// ██████████████████████████████████████████
function deleteSuite(projectId, suiteId) {
  const proj = getProject(projectId);
  if (!proj) return;
  const suite = proj.suites.find(s => s.id === suiteId);
  if (!suite) return;

  openModal(`
    <div class="modal-header">
      <h3>Delete Suite</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:0.95rem;line-height:1.6">Are you sure you want to delete suite <strong style="color:var(--danger)">"${esc(suite.name)}"</strong>?</p>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:8px">All ${suite.cases.length} test case(s) within it will be permanently removed.</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="executeDeleteSuite(${projectId}, ${suiteId})">Delete Suite</button>
    </div>
  `);
}

function executeDeleteSuite(projectId, suiteId) {
  const proj = getProject(projectId);
  if (!proj) return;

  const suite = proj.suites.find(s => s.id === suiteId);
  const suiteName = suite ? suite.name : 'Unknown';

  // *** FIX: Use filter and REASSIGN the array ***
  proj.suites = proj.suites.filter(s => s.id !== suiteId);

  addHistory(`Deleted suite "${suiteName}" from ${proj.name}`, 'red');
  saveStore();
  closeModal();
  renderPage();
  toast('Suite deleted!', 'success');
}

// ════════════════════════════════════════════
// TEST CASE CRUD
// ════════════════════════════════════════════
function openCaseModal(projectId, suiteId, editCaseId) {
  const proj = getProject(projectId);
  if (!proj) return;
  const suite = proj.suites.find(s => s.id === suiteId);
  if (!suite) return;
  const existing = editCaseId ? suite.cases.find(c => c.id === editCaseId) : null;

  openModal(`
    <div class="modal-header">
      <h3>${existing ? 'Edit' : 'New'} Test Case</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Title *</label>
        <input class="form-control" id="f-case-title" value="${existing ? esc(existing.title) : ''}" placeholder="e.g. Verify login with valid credentials">
      </div>
      <div class="form-group">
        <label>Steps</label>
        <textarea class="form-control" id="f-case-steps" placeholder="1. Go to login&#10;2. Enter credentials&#10;3. Click submit">${existing ? esc(existing.steps || '') : ''}</textarea>
      </div>
      <div class="form-group">
        <label>Expected Result</label>
        <textarea class="form-control" id="f-case-expected" placeholder="What should happen...">${existing ? esc(existing.expected || '') : ''}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select class="form-control" id="f-case-priority">
            <option value="low" ${existing?.priority==='low'?'selected':''}>Low</option>
            <option value="medium" ${!existing||existing?.priority==='medium'?'selected':''}>Medium</option>
            <option value="high" ${existing?.priority==='high'?'selected':''}>High</option>
            <option value="critical" ${existing?.priority==='critical'?'selected':''}>Critical</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="f-case-status">
            <option value="pending" ${!existing||existing?.status==='pending'?'selected':''}>Pending</option>
            <option value="pass" ${existing?.status==='pass'?'selected':''}>Pass</option>
            <option value="fail" ${existing?.status==='fail'?'selected':''}>Fail</option>
            <option value="blocked" ${existing?.status==='blocked'?'selected':''}>Blocked</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCase(${projectId},${suiteId},${editCaseId||'null'})">${existing ? 'Update' : 'Create'}</button>
    </div>
  `);
  setTimeout(() => document.getElementById('f-case-title')?.focus(), 100);
}

function saveCase(projectId, suiteId, editCaseId) {
  const title = document.getElementById('f-case-title').value.trim();
  if (!title) { toast('Title is required', 'error'); return; }

  const proj = getProject(projectId);
  if (!proj) return;
  const suite = proj.suites.find(s => s.id === suiteId);
  if (!suite) return;

  const data = {
    title,
    steps: document.getElementById('f-case-steps').value.trim(),
    expected: document.getElementById('f-case-expected').value.trim(),
    priority: document.getElementById('f-case-priority').value,
    status: document.getElementById('f-case-status').value
  };

  if (editCaseId !== null && editCaseId !== undefined) {
    const tc = suite.cases.find(c => c.id === editCaseId);
    if (tc) {
      Object.assign(tc, data);
      addHistory(`Updated case "${title}" in ${suite.name}`, 'purple');
      toast('Test case updated!', 'success');
    }
  } else {
    suite.cases.push({
      id: nextId(),
      localId: 'TC-' + String(suite.cases.length + 1).padStart(3,'0'),
      ...data,
      type: 'positive',
      createdAt: new Date().toISOString()
    });
    addHistory(`Added case "${title}" to ${suite.name}`, 'green');
    toast('Test case created!', 'success');
  }

  saveStore();
  closeModal();
  renderPage();
}

function deleteCase(projectId, suiteId, caseId) {
  const proj = getProject(projectId);
  if (!proj) return;
  const suite = proj.suites.find(s => s.id === suiteId);
  if (!suite) return;
  const tc = suite.cases.find(c => c.id === caseId);
  if (!tc) return;

  openModal(`
    <div class="modal-header">
      <h3>Delete Test Case</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:0.95rem">Delete <strong style="color:var(--danger)">"${esc(tc.title)}"</strong>?</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="executeDeleteCase(${projectId},${suiteId},${caseId})">Delete</button>
    </div>
  `);
}

function executeDeleteCase(projectId, suiteId, caseId) {
  const proj = getProject(projectId);
  if (!proj) return;
  const suite = proj.suites.find(s => s.id === suiteId);
  if (!suite) return;
  const tc = suite.cases.find(c => c.id === caseId);
  const caseName = tc ? tc.title : 'Unknown';

  suite.cases = suite.cases.filter(c => c.id !== caseId);

  addHistory(`Deleted case "${caseName}"`, 'red');
  saveStore();
  closeModal();
  renderPage();
  toast('Test case deleted!', 'success');
}

function setCaseStatus(projectId, suiteId, caseId, status) {
  const proj = getProject(projectId);
  if (!proj) return;
  const suite = proj.suites.find(s => s.id === suiteId);
  if (!suite) return;
  const tc = suite.cases.find(c => c.id === caseId);
  if (!tc) return;

  tc.status = status;
  addHistory(`Set "${tc.title}" → ${status}`, status === 'pass' ? 'green' : status === 'fail' ? 'red' : 'orange');
  saveStore();
  // Don't re-render entire page — just save silently
}

// ════════════════════════════════════════════
// OVERRIDE renderPage for project-detail
// ════════════════════════════════════════════
const _origRenderPage = renderPage;
renderPage = function() {
  const main = document.getElementById('main-content');
  main.scrollTop = 0;
  if (currentPage === 'project-detail') {
    renderProjectDetail(main);
  } else {
    switch(currentPage) {
      case 'generator':  renderGenerator(main); break;
      case 'dashboard':  renderDashboard(main); break;
      case 'projects':   renderProjects(main); break;
      case 'suites':     renderSuites(main); break;
      case 'history':    renderHistory(main); break;
      default:           renderGenerator(main);
    }
  }
  updateSidebarStat();
};

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
renderPage();
</script>
